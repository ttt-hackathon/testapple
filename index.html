<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team TestApple · Supplier Early Warning</title>
<style>
  :root { --ink: #1f2a24; --muted: #5b6b62; --accent: #2f6b4f; --bg: #f6f4ee; --card: #ffffff; --line: #ddd8cc; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--accent); color: #fff; padding: 28px 20px; }
  header .inner, main { max-width: 1100px; margin: 0 auto; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; font-weight: 600; }
  h1 { font-size: 30px; margin: 8px 0 4px; }
  header p { margin: 0; opacity: .9; }
  main { padding: 24px 20px 56px; display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; min-height: 160px; }
  #alerts { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="eyebrow">Laurel Ridge Bikeworks · Team TestApple</div>
    <h1>Supplier early-warning dashboard</h1>
    <p>Supplier risk, factory-city weather and supplier advisories in one place.</p>
  </div>
</header>
<main>
  <div id="suppliers" class="box"></div>
  <div id="weather" class="box"></div>
  <div id="alerts" class="box"></div>
</main>

<script src="data/laurel-ridge-data.js"></script>
<script src="data/signals.js"></script>
<script src="sections/suppliers.js"></script>
<script src="sections/weather.js"></script>
<script src="sections/alerts.js"></script>
</body>
</html>
